name: Stillwater Balance playable rehearsal
on:
  pull_request:
    paths:
      - 'artifacts/survivor-camp-prototype/src/game/challenge/**'
      - 'artifacts/survivor-camp-prototype/src/game/locations/**'
      - 'artifacts/survivor-camp-prototype/tests/stillwater.test.mjs'
      - 'artifacts/survivor-camp-prototype/scripts/stillwater-qa.mjs'
      - 'artifacts/survivor-camp-prototype/scripts/challenge-testing-qa.mjs'
      - 'artifacts/survivor-camp-prototype/tests/challenge-testing.test.mjs'
      - 'artifacts/survivor-camp-prototype/src/App.tsx'
      - 'artifacts/survivor-camp-prototype/vite.config.ts'
      - '.github/workflows/stillwater-balance.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stillwater-${{ github.ref }}
  cancel-in-progress: true
jobs:
  playable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts --config.strict-dep-builds=false
      - run: pnpm exec tsc -b lib/api-client-react
      - run: pnpm --filter @workspace/survivor-camp-prototype typecheck
      - run: pnpm --filter @workspace/survivor-camp-prototype test
      - run: PORT=5174 BASE_PATH=/ pnpm --filter @workspace/survivor-camp-prototype build
      - run: pnpm --filter @workspace/survivor-camp-prototype exec playwright install --with-deps chromium
      - run: pnpm --filter @workspace/survivor-camp-prototype exec node scripts/stillwater-qa.mjs
      - run: pnpm --filter @workspace/survivor-camp-prototype exec node scripts/challenge-testing-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stillwater-balance-webgl-evidence
          path: docs/stillwater-balance/evidence/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: challenge-testing-hub-webgl-evidence
          path: docs/challenge-testing/evidence/
