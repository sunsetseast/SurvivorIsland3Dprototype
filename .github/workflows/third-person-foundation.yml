name: Third-person foundation
on:
  pull_request:
    paths:
      - 'artifacts/survivor-camp-prototype/src/game/**'
      - 'artifacts/survivor-camp-prototype/scripts/third-person-qa.mjs'
      - 'artifacts/survivor-camp-prototype/tests/**'
      - '.github/workflows/third-person-foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: third-person-${{ github.ref }}
  cancel-in-progress: true
jobs:
  touch-webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts --config.strict-dep-builds=false
      - run: pnpm exec tsc -b lib/api-client-react
      - run: pnpm --filter @workspace/survivor-camp-prototype typecheck
      - run: pnpm --filter @workspace/survivor-camp-prototype test
      - run: PORT=5220 BASE_PATH=/ pnpm --filter @workspace/survivor-camp-prototype build
      - run: pnpm --filter @workspace/survivor-camp-prototype exec playwright install --with-deps chromium
      - run: pnpm --filter @workspace/survivor-camp-prototype exec node scripts/third-person-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: third-person-touch-webgl
          path: docs/third-person-foundation/evidence/
