name: Living camp checks
on:
  pull_request:
    paths:
      - 'artifacts/survivor-camp-prototype/**'
      - 'lib/api-client-react/**'
      - 'pnpm-lock.yaml'
      - 'tools/blender/**'
      - '.github/workflows/living-camp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  camp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts --config.strict-dep-builds=false
      - run: pnpm exec tsc -b lib/api-client-react
      - run: pnpm --filter @workspace/survivor-camp-prototype typecheck
      - run: pnpm --filter @workspace/survivor-camp-prototype test
      - run: node artifacts/survivor-camp-prototype/scripts/world-check.mjs
      - run: PORT=5174 BASE_PATH=/ pnpm --filter @workspace/survivor-camp-prototype build
      - run: pnpm --filter @workspace/survivor-camp-prototype exec playwright install --with-deps chromium
      - run: pnpm --filter @workspace/survivor-camp-prototype qa:living-camp
      - run: pnpm --filter @workspace/survivor-camp-prototype qa:tribal
      - run: pnpm --filter @workspace/survivor-camp-prototype qa:assets
      - run: pnpm --filter @workspace/survivor-camp-prototype preview:standalone
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: living-camp-webgl-evidence
          path: |
            docs/living-camp/evidence/
            docs/tribal-council/evidence/
            docs/tribal-council/overhaul-evidence/
            docs/tribal-council/blender-evidence/
            docs/tribal-council/polish-evidence/
            artifacts/survivor-camp-prototype/dist/standalone/
